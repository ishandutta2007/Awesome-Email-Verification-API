<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0)" />
      <stop offset="50%" stop-color="rgba(52, 211, 153, 0.85)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.75; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes scanSweep {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(900px); }
      }
      @keyframes blinkGreen {
        0%, 100% { fill: #10b981; filter: drop-shadow(0 0 8px #10b981); }
        50% { fill: #059669; filter: drop-shadow(0 0 2px #059669); }
      }
      @keyframes floatRing {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 50; }
      }
      @keyframes badgePulse {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.9)); }
      }
      .glowing-title {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .scanner-beam {
        animation: scanSweep 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .pulse-dot {
        animation: blinkGreen 2s ease-in-out infinite;
      }
      .animated-circle {
        stroke-dasharray: 24 12;
        animation: floatRing 8s linear infinite;
      }
      .shield-pulse {
        animation: badgePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="84" x2="1200" y2="84" />
    <line x1="0" y1="168" x2="1200" y2="168" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="336" x2="1200" y2="336" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="140" r="180" fill="#6366f1" opacity="0.16" filter="url(#glow)" />
  <circle cx="1020" cy="280" r="210" fill="#10b981" opacity="0.13" filter="url(#glow)" />
  <circle cx="620" cy="210" r="170" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />

  <!-- Left Icon: Verification Shield & Envelope -->
  <g transform="translate(80, 115)" class="shield-pulse">
    <!-- Animated outer ring -->
    <circle cx="90" cy="90" r="84" fill="none" stroke="url(#primaryGlow)" stroke-width="2.5" class="animated-circle" />
    <!-- Background circle -->
    <circle cx="90" cy="90" r="74" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Shield / Mail Graphic -->
    <path d="M 90 35 L 140 58 C 140 105 118 138 90 152 C 62 138 40 105 40 58 Z" fill="none" stroke="#6366f1" stroke-width="3" stroke-linejoin="round" />
    <path d="M 60 75 L 90 98 L 120 75" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
    <rect x="58" y="72" width="64" height="42" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2" />
    
    <!-- Verified Checkmark Badge -->
    <circle cx="126" cy="126" r="22" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
    <path d="M 117 126 L 123 132 L 135 119" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#badgeGlow)" />
  </g>

  <!-- Main Title & Typography -->
  <g transform="translate(290, 105)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="235" height="30" rx="15" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
    <circle cx="16" cy="15" r="5" class="pulse-dot" />
    <text x="32" y="20" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Email Verification API</text>

    <!-- Subtitle / Description -->
    <text x="0" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Top SaaS Platforms, Pricing, Free Tier Limits &amp; Open-Source Validation Engines
    </text>

    <!-- Interactive Pipeline Status Bar -->
    <g transform="translate(0, 150)">
      <!-- Container -->
      <rect x="0" y="0" width="820" height="56" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      
      <!-- Clip path for scanner beam -->
      <clipPath id="barClip">
        <rect x="0" y="0" width="820" height="56" rx="10" />
      </clipPath>
      
      <!-- Moving Scanner Beam -->
      <rect x="0" y="0" width="220" height="56" fill="url(#scanBeam)" clip-path="url(#barClip)" class="scanner-beam" opacity="0.6" />

      <!-- Step 1: Syntax -->
      <g transform="translate(25, 18)">
        <circle cx="10" cy="10" r="5" fill="#10b981" />
        <text x="24" y="15" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Syntax Check</text>
      </g>
      <line x1="160" y1="12" x2="160" y2="44" stroke="#334155" stroke-width="1" />

      <!-- Step 2: DNS / MX -->
      <g transform="translate(185, 18)">
        <circle cx="10" cy="10" r="5" fill="#10b981" />
        <text x="24" y="15" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">DNS &amp; MX Lookup</text>
      </g>
      <line x1="360" y1="12" x2="360" y2="44" stroke="#334155" stroke-width="1" />

      <!-- Step 3: SMTP Probe -->
      <g transform="translate(385, 18)">
        <circle cx="10" cy="10" r="5" fill="#10b981" />
        <text x="24" y="15" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">SMTP Handshake</text>
      </g>
      <line x1="560" y1="12" x2="560" y2="44" stroke="#334155" stroke-width="1" />

      <!-- Step 4: Disposable / Risk -->
      <g transform="translate(585, 18)">
        <circle cx="10" cy="10" r="5" fill="#10b981" />
        <text x="24" y="15" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Disposable &amp; Spam-Trap</text>
      </g>
    </g>

    <!-- Bottom Feature Badges -->
    <g transform="translate(0, 230)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="14" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">⚡ 20+ SaaS APIs</text>

      <!-- Badge 2 -->
      <rect x="142" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="156" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">⭐ 25+ Open Source</text>

      <!-- Badge 3 -->
      <rect x="309" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="323" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">🛡️ Catch-All &amp; Role</text>

      <!-- Badge 4 -->
      <rect x="466" y="0" width="170" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="480" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">🚀 Self-Hosted Stacks</text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.45" />
</svg>
